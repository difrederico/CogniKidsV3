[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# utcnow() e deprecado no Python 3.12; a migracao para datetimes com
# timezone esta pendente e nao deve poluir a saida dos testes.
filterwarnings =
    ignore::DeprecationWarning

markers =
    integracao: exige MongoDB real (cai para mongomock se ausente)
